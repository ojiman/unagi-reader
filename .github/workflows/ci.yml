name: Unagi Reader CI

on:
  # No paths-ignore here: every pull request must report the `check` status (the ruleset requires it), so a
  # documentation-only change still starts this workflow. The `changes` job then skips the macOS jobs for it.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      packaging: ${{ steps.classify.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Only a pull request can be documentation-only or skip the release build. Any other event runs everything.
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
            code=$(printf '%s\n' "$files" | bash scripts/ci-gate.sh classify)
            packaging=$(printf '%s\n' "$files" | bash scripts/ci-gate.sh packaging)
          else
            code=true
            packaging=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"
          echo "code changed: $code, build or packaging changed: $packaging"

  # Tests (this also compiles the whole app in debug). Runs for every change that touches code.
  regression:
    name: regression
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # No macOS 27 runner exists yet: this verifies the build floor (26.6), not the support floor (27.0). See docs/architecture.md#5-build-and-ci.
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CI_RESULTS: ${{ github.workspace }}/ci-results
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record commit and environment
        run: |
          mkdir -p "$CI_RESULTS"
          {
            git rev-parse HEAD
            printf 'pr_head=%s\n' "$PR_HEAD"
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
          } | tee "$CI_RESULTS/environment.txt"
      - name: Check synthetic startup isolation
        run: bash scripts/test-synthetic-startup.sh | tee "$CI_RESULTS/synthetic-startup.log"
      - name: Run tests
        run: |
          # The log can lose the end lines of fast tests (#186), so Swift Testing also writes its own xUnit record
          # (tests-swift-testing.xml), which the next step checks.
          status=0
          { time swift test --scratch-path "$RUNNER_TEMP/unagi-reader-ci-build" --force-resolved-versions --disable-keychain --disable-netrc --skip "$(bash scripts/ci-gate.sh local-tests)" --xunit-output "$CI_RESULTS/tests.xml"; } > "$CI_RESULTS/tests.log" 2>&1 || status=$?
          cat "$CI_RESULTS/tests.log"
          exit "$status"
      # A test process can end early with exit code 0 and no summary line; `swift test` then looks like a pass.
      - name: Check that the test run finished
        run: bash scripts/check-test-log.sh "$CI_RESULTS/tests.log" "$CI_RESULTS/tests-swift-testing.xml"
      - name: Save logs and artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unagi-reader-regression-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.CI_RESULTS }}/
          if-no-files-found: warn
          retention-days: 7

  # The optimized build, the ad hoc signature, and the packaged app. It takes the longest, so a pull request runs it
  # only when it changes how the app is built or packaged (Package.swift, scripts/build-app.sh, scripts/make-dmg.sh,
  # the notices file, app assets, or the workflows). Every push to main and every manual run builds it.
  release:
    name: release
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true')
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CI_RESULTS: ${{ github.workspace }}/ci-results
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record commit and environment
        run: |
          mkdir -p "$CI_RESULTS"
          {
            git rev-parse HEAD
            printf 'pr_head=%s\n' "$PR_HEAD"
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
          } | tee "$CI_RESULTS/environment.txt"
      - name: Build and verify ad hoc Release app
        run: |
          { time bash scripts/build-app.sh release; } 2>&1 | tee "$CI_RESULTS/build.log"
          bash scripts/test-build-app.sh
          package_dir=$(mktemp -d "$RUNNER_TEMP/unagi-reader-adhoc.XXXXXX")
          ditto -c -k --sequesterRsrc --keepParent ".build/Unagi Reader.app" "$CI_RESULTS/UnagiReader-adhoc.zip"
          ditto -x -k "$CI_RESULTS/UnagiReader-adhoc.zip" "$package_dir"
          codesign --verify --deep --strict "$package_dir/Unagi Reader.app"
          test -s "$package_dir/Unagi Reader.app/Contents/Resources/AppIcon.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$package_dir/Unagi Reader.app/Contents/Info.plist")" = AppIcon
      - name: Make and check the DMG
        run: |
          bash scripts/test-make-dmg.sh
          bash scripts/make-dmg.sh ".build/Unagi Reader.app" "$CI_RESULTS/UnagiReader-0.0.0.dmg"
      - name: Save logs and artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unagi-reader-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.CI_RESULTS }}/
          if-no-files-found: warn
          retention-days: 7

  # The one status that the ruleset requires. It always runs. It fails when the tests fail, when the release build
  # fails where it was due, or when a job that was due was skipped or cancelled.
  check:
    name: check
    needs: [changes, regression, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test the gate script
        run: bash scripts/test-ci-gate.sh
      - name: Test the test-log check script
        run: bash scripts/test-check-test-log.sh
      - name: Test the UI smoke support
        run: bash scripts/test-run-ui-smoke.sh
      - name: Test the release tag check
        run: bash scripts/test-release-version.sh
      - name: Test the documents check
        run: bash scripts/test-check-docs.sh
      - name: Check the documents (links, decision numbers, status marks, closed issues and 1.0 features)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A pull request that closes a 1.0 issue removes its status mark; the check treats that issue as done.
          if [ -n "$PR" ]; then
            CLOSING_ISSUES=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '[.closingIssuesReferences[].number] | map(tostring) | join(",")')
            export CLOSING_ISSUES
          fi
          python3 scripts/check_docs.py --online
      - name: Decide
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          PACKAGING: ${{ needs.changes.outputs.packaging }}
          EVENT: ${{ github.event_name }}
          REGRESSION: ${{ needs.regression.result }}
          RELEASE: ${{ needs.release.result }}
        run: bash scripts/ci-gate.sh verdict "$CHANGES" "${CODE:-true}" "${PACKAGING:-true}" "$EVENT" "$REGRESSION" "$RELEASE"
